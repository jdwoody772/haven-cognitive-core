<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haven — Cognitive Core</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151d;color:#e9eff6}body{margin:0;padding:18px;max-width:820px;margin:auto}h1{margin-bottom:4px}p,small{color:#a7b6c9}.panel{background:#1a2430;border:1px solid #344254;border-radius:16px;padding:16px;margin:16px 0}input,button{font:inherit;border-radius:9px;padding:12px;border:1px solid #52657b;background:#253446;color:white}input{width:75px}button{background:#246c9e;border:0;cursor:pointer}button:active{opacity:.7}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}svg{width:100%;height:320px;background:#111c29;border-radius:12px}line{stroke:#5c9ac7}circle{fill:#43a3df}text{fill:white;font-size:13px;text-anchor:middle}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c7d7e8}strong{color:#8bd0ff}</style></head><body>
<h1>Haven <small>2.0 / experimental core</small></h1><p>Persistent weighted graph · prediction learning · live activity</p>
<section class="panel"><h2>Teach a transition</h2><p>Show Haven that one symbol is followed by another. Repeat and change the lessons to observe adaptation.</p><div class="controls"><input id="a" value="A" maxlength="32" aria-label="First symbol"><span>→</span><input id="b" value="B" maxlength="32" aria-label="Next symbol"><button onclick="teach()">Teach</button><button onclick="pause()">Pause / Resume activity</button></div><p id="feedback"></p></section>
<section class="panel"><h2>Live graph</h2><svg id="graph" viewBox="0 0 340 320" role="img" aria-label="Network graph"></svg><p id="count"></p></section>
<section class="panel"><h2>Recent learning</h2><pre id="events">Loading…</pre></section>
<script>
const $=id=>document.getElementById(id);
async function api(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}
async function teach(){let r=await api('/api/teach',{source:$('a').value,target:$('b').value});$('feedback').textContent=r.error||('Before: '+r.prediction_before+' | After: '+r.prediction_after+' | Target probability: '+r.confidence_after);refresh()}
async function pause(){let r=await api('/api/pause',{});$('feedback').textContent=r.running?'Activity resumed':'Activity paused'}
function elt(name,attrs,parent){let n=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));parent.appendChild(n);return n}
async function refresh(){try{let r=await fetch('/api/state');let s=await r.json();let svg=$('graph');svg.replaceChildren();let nodes=s.nodes;let coords={};nodes.forEach((n,i)=>{let a=2*Math.PI*i/nodes.length-Math.PI/2;coords[n.id]=[170+115*Math.cos(a),160+115*Math.sin(a)]});s.edges.forEach(e=>{let p=coords[e.source],q=coords[e.target];if(p&&q)elt('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],'stroke-width':Math.min(7,1+Math.abs(e.weight)*5),opacity:e.weight>0?.8:.3},svg)});nodes.forEach(n=>{let p=coords[n.id];elt('circle',{cx:p[0],cy:p[1],r:18+14*n.activation},svg);elt('text',{x:p[0],y:p[1]+4},svg).textContent=n.id});$('count').textContent=s.steps+' lessons · '+nodes.length+' nodes · '+s.edges.length+' learned connections';$('events').textContent=s.history.slice(-8).reverse().map(e=>e.source+' → '+e.target+' | predicted '+e.prediction_before+' | '+(e.correct_before?'correct':'incorrect')).join('\n')||'No lessons yet'}catch(e){$('events').textContent='Connection unavailable: '+e.message}}
refresh();setInterval(refresh,1000)
</script></body></html>
